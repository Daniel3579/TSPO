syntax = "proto3";

package data;

option go_package = "./proto/gen;pb";

service DataService {
    rpc Overview (CompanyRequest) returns (OverviewResponse);
    rpc IncomeStatement (FinancialRequest) returns (IncomeStatementResponse);
    rpc BalanceSheet (FinancialRequest) returns (BalanceSheetResponse);
    rpc CashFlow (FinancialRequest) returns (CashFlowResponse); 
}

// –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

message CompanyRequest {
    string name = 1;
}

// ––––––––––––––––––––––––––––

message Quarter {
    int32 year = 1;
    int32 quarter = 2;
}

message QuarterRange {
    Quarter start = 1;
    Quarter end = 2;
}

message FinancialRequest {
    string name = 1;
    oneof timeframe {
        Quarter date = 2;
        QuarterRange range = 3;
    }
}

// –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

