}

message BalanceSheetResponse {
    oneof response {
        SingleBalanceSheetResponse single = 1;
        MultipleBalanceSheetResponse multiple = 2;
    }
}

// –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

message SingleCashFlowResponse {
    string symbol = 1;
    string fiscaldateending = 2;
    string reportedcurrency = 3;
    string operatingcashflow = 4;
    string paymentsforoperatingactivities = 5;
    string proceedsfromoperatingactivities = 6;
    string changeinoperatingliabilities = 7;
    string changeinoperatingassets = 8;
    string depreciationdepletionandamortization = 9;
    string capitalexpenditures = 10;
    string changeinreceivables = 11;
    string changeininventory = 12;
    string profitloss = 13;
    string cashflowfrominvestment = 14;
    string cashflowfromfinancing = 15;
    string proceedsfromrepaymentsofshorttermdebt = 16;
    string paymentsforrepurchaseofcommonstock = 17;
    string paymentsforrepurchaseofequity = 18;
    string paymentsforrepurchaseofpreferredstock = 19;
    string dividendpayout = 20;
    string dividendpayoutcommonstock = 21;
    string dividendpayoutpreferredstock = 22;
    string proceedsfromissuanceofcommonstock = 23;
    string proceedsfromissuanceoflongtermdebtandcapitalsecuritiesnet = 24;
    string proceedsfromissuanceofpreferredstock = 25;
    string proceedsfromrepurchaseofequity = 26;
    string proceedsfromsaleoftreasurystock = 27;
    string stockbasedcompensation = 28;
    string changeincashandcashequivalents = 29;
    string changeinexchangerate = 30;
    string netincome = 31;
}

message MultipleCashFlowResponse {
    repeated SingleCashFlowResponse response = 1;
}

message CashFlowResponse {
    oneof response {
        SingleCashFlowResponse single = 1;
        MultipleCashFlowResponse multiple = 2;
    }
}