services:
  tspo-db:
    build:
      context: postgres
    image: tspo/postgres-image
    container_name: tspo-postgres-service
    ports:
      - "5432:5432"
    env_file: ./postgres/.env
    volumes:
      - ./postgres/data/postgres:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tspo-server:
    build:
      context: go-server
    image: tspo/go-image
    container_name: tspo-go-service
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./go-server/.env:/app/.env:ro
    depends_on:
      tspo-db:
        condition: service_healthy

  tspo-client:
    build:
      context: vue-client
    image: tspo/vue-image
    container_name: tspo-vue-service
    ports:
      - "5137:80"
    environment:
      - BACKEND_URL=http://host.docker.internal:8081/